<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erae 2 simulator</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0e; color: #ddd; font: 13px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #wrap { flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #bar { padding: 6px 10px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: #16161c; }
  #status { font-family: ui-monospace, Consolas, monospace; }
  details { padding: 4px 10px; background: #101015; }
  pre { margin: 4px 0; max-height: 18vh; overflow: auto; font-size: 11px; }
  .logs { display: flex; gap: 12px; }
  .logs > div { flex: 1; min-width: 0; }
  /* Docked in the Eigendrum page: the grid and the pressure slider take the whole frame. */
  .docked details { display: none; }
</style>
</head>
<body>
<script>if (location.search.includes('docked')) document.body.classList.add('docked');</script>
<div id="wrap"><canvas id="led" aria-label="Simulated Erae 2 LED surface, 42 by 24"></canvas></div>
<div id="bar">
  <label>Pressure <input id="press" type="range" min="0" max="1" step="0.01" value="0.5"> <output id="pv">0.50</output></label>
  <button id="room" type="button" aria-label="Toggle ambient light">Dark room</button>
  <span id="status" role="status"></span>
</div>
<details>
  <summary>Message log (last 30 each way)</summary>
  <div class="logs">
    <div>From host<pre id="logIn"></pre></div>
    <div>To host<pre id="logOut"></pre></div>
  </div>
</details>
<script type="module" src="sim.js"></script>
</body>
</html>
