name: CI

on:
  push:
    branches: [main, master, poki]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The app itself has no dependencies; this only pulls in the headless
      # browser used by the smoke tests.
      - run: npm install

      - name: Unit and accuracy tests
        run: npm test

      - name: Solver accuracy report
        run: npm run bench

      - name: Verify the isospectral pair
        run: npm run isospectral

      # The game's central promise: no level without a provably winning strike.
      # This caught six unwinnable levels out of twenty-five when it was written.
      - name: Verify every game level is winnable
        run: npm run poki:levels

      - name: Browser smoke test
        run: |
          npm run serve &
          npx wait-on http://localhost:8080 || sleep 5
          npm run smoke
          npm run mobile
          npm run poki:smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: .smoke/
          if-no-files-found: ignore

  # Pages has a single source, and this branch is a superset of master: it carries
  # the instrument *and* the game, so one deploy publishes both.
  #   /                    the instrument
  #   /poki-ready-copy/    the game
  deploy:
    needs: test
    if: github.ref == 'refs/heads/poki'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # No build step: the source *is* the site.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
