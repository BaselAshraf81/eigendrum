name: CI

on:
  push:
    branches: [main, master, poki]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The app itself has no dependencies; this only pulls in the headless
      # browser used by the smoke tests.
      - run: npm install

      - name: Unit and accuracy tests
        run: npm test

      - name: Solver accuracy report
        run: npm run bench

      - name: Verify the isospectral pair
        run: npm run isospectral

      # The game's central promise: no level without a provably winning strike.
      # This caught six unwinnable levels out of twenty-five when it was written.
      - name: Verify every game level is winnable
        run: npm run poki:levels

      - name: Browser smoke test
        run: |
          npm run serve &
          npx wait-on http://localhost:8080 || sleep 5
          npm run smoke
          npm run mobile
          npm run poki:smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: .smoke/
          if-no-files-found: ignore

  # There is deliberately no deploy job on this branch.
  #
  # GitHub Pages serves this branch directly (Settings -> Pages, source: poki, /),
  # because there is no build step: the source *is* the site. Publishing that way
  # also keeps deployment independent of CI, so a flaky headless-browser run cannot
  # take the live game down.
  #
  # This branch is a superset of master, so one source publishes both:
  #   /                    the instrument
  #   /poki-ready-copy/    the game
